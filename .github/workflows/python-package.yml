# This workflow lints the package and runs the test suite on all supported Python versions.
# Dependencies are installed with Poetry from the committed lockfile so that CI runs the exact
# dependency versions the test golden values were validated against.

name: Python package

on:
  push:
    branches: [ "refactor" ]
  pull_request:
    branches: [ "refactor" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Poetry
      run: pipx install poetry
    - name: Install dependencies
      run: |
        poetry env use python${{ matrix.python-version }}
        poetry install --with dev
    - name: Lint with flake8
      run: |
        python -m pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: poetry run pytest tests/
